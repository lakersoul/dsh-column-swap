# dsh-column-swap bundle patch
#
# 本包作为 profile bundle 时的装配层：这一行把插件行插进组合。
#
# 与旧的手动通道的区别：手动通道是把同一行写进 profile 自己的
# cordis.patch.yml（绝对路径），本文件则由 profile manifest 的
# dsh.profile.bundles 在启动时装配 —— 也就是「正规 bundle 通道」，
# 市场的本地开发识别、dsh plugin 的 bundles 排序与 reconcile 都认它。
#
# 两者绝不能同时生效：同一个包会从两个 Loader 源出现，客户端模块扫描
# （dsh-client-modules）会因「resolves from multiple active Loader sources」
# 直接抛错，甚至让 boot 失败。install.mjs 每次都会把另一种通道清干净。
#
# 行名用包名（而非绝对路径），因为 bundle 层里包已经被安装进 profile 的
# node_modules（link: 符号链接），按名字解析才能跟随包目录搬家。
- insert:
    - id: column-swap
      name: 'dsh-column-swap'
